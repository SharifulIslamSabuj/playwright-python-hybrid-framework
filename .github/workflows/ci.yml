# CI/CD workflow — implements docs/10-Automation-Strategy.md §18/§19/§21/§22
# and docs/11-Framework-Architecture.md §27/§29/§30/§31 exactly, per the
# QA-Lead-approved Step 19 execution plan (docs/19-CI-CD.md).
#
# Runs all 31 implemented, approved automated Test Cases (17 UI + 13 API +
# 1 Hybrid — the 9 cases originally blocked on account-provisioning
# authorization were resolved via the disposable account-lifecycle
# architecture, docs/18-Defect-Documentation.md §14), selected via the
# pytest markers already registered in pyproject.toml.
#
# Docker is intentionally NOT part of this workflow — per docs/11 §44 it is
# assigned to Step 20+, not Step 19 (docs/19-CI-CD.md §5).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Nightly canary run — independent of code changes, primarily surfaces
  # environment/AUT-availability instability of the kind documented as
  # OBS-001 in docs/18-Defect-Documentation.md (docs/10 §22).
  schedule:
    - cron: "0 2 * * *"
  # Release validation is manually triggered: no git-tag/release-branch
  # convention has been approved anywhere in docs/01-18, so a manual
  # workflow_dispatch is used rather than inventing an automatic release
  # trigger the project has never defined (docs/19-CI-CD.md §5).
  workflow_dispatch: {}

env:
  AUT_BASE_URL: https://automationexercise.com
  API_BASE_URL: https://automationexercise.com
  # DURABLE_VALID_USER_EMAIL/PASSWORD/DURABLE_EXISTING_USER_EMAIL were
  # removed from this workflow-level env block (Step 8 architecture
  # review): none of the 31 business regression cases consume them —
  # every account-dependent case now uses the disposable
  # shared_registered_account lifecycle (tests/conftest.py), gated solely
  # by ACCOUNT_CREATION_EXECUTION_AUTHORIZED (nightly_regression job env,
  # below). The durable_valid_account/durable_existing_account fixtures
  # themselves remain in tests/conftest.py as optional infrastructure —
  # only their CI wiring was removed here, since it was unused weight.

jobs:
  # PR gate + Main branch regression (docs/10 §22: "Same as PR, Chromium").
  # Selection = "regression and not ci_restricted": today this evaluates to
  # exactly the 22 implemented cases (ci_restricted currently has zero
  # implemented members — the 3 CI-RESTRICTED cases are all BLOCKED). The
  # explicit exclusion is kept so this durably never runs a CI-RESTRICTED
  # case on PR, even once those cases are eventually implemented.
  pr_main_regression:
    name: PR / Main Regression (Chromium)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # No [build-system] table exists in pyproject.toml (the project is not
      # packaged/installable — docs/12-Project-Setup.md), so dependencies are
      # installed directly from [project.dependencies], read with the
      # standard-library tomllib (Python 3.11+, matches requires-python).
      # This keeps pyproject.toml as the single source of truth instead of
      # duplicating the pinned version list into this YAML file.
      - name: "Install dependencies (single source of truth: pyproject.toml)"
        run: |
          python -m pip install --upgrade pip
          pip install $(python -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))")

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # Tier 1 (docs/17-Execution-Report.md §6): infrastructure/framework
      # health checks, not business Test Cases — run by path, not marker,
      # since they intentionally carry no business-tier marker.
      - name: Framework foundation checks (Tier 1)
        run: python -m pytest tests/test_setup_validation.py tests/test_framework_foundation.py -v -m "not requires_all_browsers"

      # CI-only bounded retries (docs/10 §16, docs/11 §30: mirrors the
      # cited {ci: 2, local: 0} precedent). Never configured as the local
      # default in pyproject.toml's addopts — local runs still fail fast.
      # No -n/xdist parallelism: docs/10 §21 / docs/11 §29 durably favor
      # reliability over speed against this single shared public AUT,
      # reinforced by the network instability documented as OBS-001.
      - name: Approved automated regression suite (Chromium)
        run: >
          python -m pytest -m "regression and not ci_restricted"
          --reruns 2 --reruns-delay 3 -v
          --html=reports/html/regression-chromium.html --self-contained-html

      # Evidence preserved on failure regardless of which step failed
      # (docs/10 §15/§19): HTML report every run, screenshots on UI
      # failure, traces on retry-then-fail. Logs are the job's own console
      # output (src/utils/logger.py writes to stdout, no file handler) —
      # already retained natively by GitHub Actions, no separate upload.
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-main-regression-${{ github.run_id }}
          path: |
            reports/html/
            reports/artifacts/
          retention-days: 14
          if-no-files-found: ignore

  # Nightly canary (docs/10 §22): full 31-case set including the 3
  # CI-RESTRICTED cases (AE-UI-TC-004, AE-API-TC-011/012), which are now
  # implemented and marked. This job's `-m regression` selection (no
  # exclusion) therefore genuinely differs from pr_main_regression's
  # `-m "regression and not ci_restricted"` — docs/19-CI-CD.md §16.
  nightly_regression:
    name: Nightly Regression (Chromium, full set)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Job-scoped, not workflow-level: this must never leak into
      # pr_main_regression. That job's marker filter ("regression and not
      # ci_restricted") excludes AE-API-TC-011/012 (the account creator/
      # deleter) but NOT AE-UI-TC-005/007/008/021 or AE-API-TC-007/014 —
      # any of those six would still trigger shared_registered_account's
      # first-use account creation on a PR run, with no TC-012 in that same
      # job ever running to delete it (an orphaned-account defect), and
      # would violate this project's own CI-RESTRICTED design: state-
      # mutating tests confined to MAIN/NIGHTLY, never PR
      # (docs/09-Automation-Scope.md §6). Nightly is the correct, and only
      # correct, scope for this gate.
      ACCOUNT_CREATION_EXECUTION_AUTHORIZED: ${{ secrets.ACCOUNT_CREATION_EXECUTION_AUTHORIZED }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: "Install dependencies (single source of truth: pyproject.toml)"
        run: |
          python -m pip install --upgrade pip
          pip install $(python -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))")

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Framework foundation checks (Tier 1)
        run: python -m pytest tests/test_setup_validation.py tests/test_framework_foundation.py -v -m "not requires_all_browsers"

      - name: Full regression suite, including CI-RESTRICTED tier (Chromium)
        run: >
          python -m pytest -m regression
          --reruns 2 --reruns-delay 3 -v
          --html=reports/html/regression-nightly.html --self-contained-html

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-regression-${{ github.run_id }}
          path: |
            reports/html/
            reports/artifacts/
          retention-days: 14
          if-no-files-found: ignore

  # Release validation (docs/10 §17/§22): full Chromium regression + the
  # curated 4-case cross-browser subset (AE-UI-TC-006/015/018/024) on
  # Firefox and WebKit. The curated subset is NOT re-run on the chromium
  # leg — it is already covered by that leg's full-regression pass, since
  # every cross_browser-marked test also carries the regression marker.
  release_validation:
    name: Release Validation
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: "Install dependencies (single source of truth: pyproject.toml)"
        run: |
          python -m pip install --upgrade pip
          pip install $(python -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))")

      - name: Install Playwright browser (${{ matrix.browser }})
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Framework foundation checks (Tier 1, Chromium leg only)
        if: matrix.browser == 'chromium'
        run: python -m pytest tests/test_setup_validation.py tests/test_framework_foundation.py -v -m "not requires_all_browsers"

      # --override-ini, not a bare --browser flag: pytest-playwright's
      # --browser is a multi-value option, so a CLI --browser=X ACCUMULATES
      # with pyproject.toml's own baked-in "--browser=chromium" addopts
      # entry rather than replacing it — CONFIRMED as the actual root cause
      # of GitHub Actions run 33027459633 (2026-08-27): the firefox/webkit
      # legs collected both `[chromium]` and the target-browser variants
      # (only the target browser is installed on that runner, so every
      # `[chromium]` variant failed with "Executable doesn't exist"), and
      # the chromium leg silently duplicated every UI/Hybrid test as
      # `[chromium0]`/`[chromium1]`, roughly doubling real request volume
      # against the AUT and very plausibly triggering the HTTP 403
      # responses observed in that run's failure screenshots. This exact
      # accumulation bug and this exact fix were already found and
      # verified for local cross-browser execution earlier in this
      # project's history — never previously propagated into this
      # workflow file.
      - name: Full regression suite (Chromium leg only)
        if: matrix.browser == 'chromium'
        run: >
          python -m pytest -m regression
          --override-ini="addopts=--strict-markers --screenshot=only-on-failure --tracing=retain-on-failure --output=reports/artifacts --browser=chromium"
          --reruns 2 --reruns-delay 3 -v
          --html=reports/html/release-chromium.html --self-contained-html

      - name: Curated cross-browser subset (${{ matrix.browser }})
        if: matrix.browser != 'chromium'
        run: >
          python -m pytest -m cross_browser
          --override-ini="addopts=--strict-markers --screenshot=only-on-failure --tracing=retain-on-failure --output=reports/artifacts --browser=${{ matrix.browser }}"
          --reruns 2 --reruns-delay 3 -v
          --html=reports/html/release-${{ matrix.browser }}.html --self-contained-html

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            reports/html/
            reports/artifacts/
          retention-days: 14
          if-no-files-found: ignore

  # Full Project Validation: an explicit, manually-triggered job that runs
  # every currently collected pytest node with no marker filter at all —
  # unlike every other job above, which intentionally scopes to a subset
  # (regression, cross_browser, ci_restricted-excluded, etc.). Exists
  # specifically to answer "does the complete 61-node suite pass end to
  # end", including Tier-1, all 31 business cases (ci_restricted included),
  # and the 9 account-lifecycle cases — none of which any existing job
  # runs together in one place. Not on a schedule and not part of the
  # push/PR gate — deliberately a manually-invoked, one-time-per-need
  # validation, not a new standing CI tier.
  full_project_validation:
    name: Full Project Validation (all collected tests)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Required because this is the one job that runs the account-
      # lifecycle business cases (AE-UI-TC-004, AE-API-TC-011/012, and
      # everything routed through shared_registered_account) — same gate,
      # same reasoning as nightly_regression's own env block above.
      ACCOUNT_CREATION_EXECUTION_AUTHORIZED: ${{ secrets.ACCOUNT_CREATION_EXECUTION_AUTHORIZED }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: "Install dependencies (single source of truth: pyproject.toml)"
        run: |
          python -m pip install --upgrade pip
          pip install $(python -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))")

      # All three engines, unlike every other job here: this is the only
      # job that runs test_setup_validation.py's requires_all_browsers
      # check (no -m filter excludes it), which needs chromium, firefox,
      # AND webkit installed in the same job to pass.
      - name: Install Playwright (all engines)
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Full project validation (all currently collected tests, no marker filter)
        run: >
          python -m pytest -v
          --html=reports/html/full-validation.html --self-contained-html

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-validation-${{ github.run_id }}
          path: |
            reports/html/
            reports/artifacts/
          retention-days: 14
          if-no-files-found: ignore
