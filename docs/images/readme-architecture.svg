<svg viewBox="0 0 920 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="720" fill="#FFFFFF"/>

  <!-- Layer 1: Execution / Runner (blue) -->
  <rect x="310" y="20" width="300" height="56" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="460" y="43" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A8A">Developer / Test Runner</text>
  <text x="460" y="61" text-anchor="middle" font-size="11.5" fill="#1E40AF">python -m pytest  ·  pytest-xdist  ·  --browser</text>

  <line x1="460" y1="76" x2="460" y2="100" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: Test Layers (green) -->
  <text x="460" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">TEST LAYERS</text>
  <rect x="60"  y="128" width="250" height="56" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="185" y="151" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532D">UI Tests</text>
  <text x="185" y="169" text-anchor="middle" font-size="11" fill="#166534">tests/ui — 19 nodes</text>

  <rect x="335" y="128" width="250" height="56" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="460" y="151" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532D">API Tests</text>
  <text x="460" y="169" text-anchor="middle" font-size="11" fill="#166534">tests/api — 13 nodes</text>

  <rect x="610" y="128" width="250" height="56" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="735" y="151" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532D">Hybrid Tests</text>
  <text x="735" y="169" text-anchor="middle" font-size="11" fill="#166534">tests/hybrid — 1 node</text>

  <line x1="185" y1="184" x2="185" y2="200" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="460" y1="184" x2="460" y2="200" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="735" y1="184" x2="735" y2="200" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="185" y1="200" x2="735" y2="200" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="460" y1="200" x2="460" y2="222" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: Framework Components (purple) -->
  <text x="460" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#5B21B6">FRAMEWORK COMPONENTS</text>
  <rect x="30"  y="250" width="210" height="56" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="135" y="273" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D95">Page Objects</text>
  <text x="135" y="291" text-anchor="middle" font-size="10.5" fill="#5B21B6">src/pages/</text>

  <rect x="255" y="250" width="210" height="56" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="360" y="273" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D95">API Clients</text>
  <text x="360" y="291" text-anchor="middle" font-size="10.5" fill="#5B21B6">src/api/</text>

  <rect x="480" y="250" width="210" height="56" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="585" y="273" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D95">Fixtures</text>
  <text x="585" y="291" text-anchor="middle" font-size="10.5" fill="#5B21B6">tests/conftest.py</text>

  <rect x="705" y="250" width="185" height="56" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="797" y="273" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4C1D95">Utilities / Config</text>
  <text x="797" y="291" text-anchor="middle" font-size="10" fill="#5B21B6">src/utils, src/config</text>

  <line x1="135" y1="306" x2="135" y2="322" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="360" y1="306" x2="360" y2="322" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="585" y1="306" x2="585" y2="322" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="797" y1="306" x2="797" y2="322" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="135" y1="322" x2="797" y2="322" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="460" y1="322" x2="460" y2="344" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4: Test Data (yellow) -->
  <rect x="310" y="354" width="300" height="56" rx="8" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.5"/>
  <text x="460" y="377" text-anchor="middle" font-size="14" font-weight="600" fill="#854D0E">Test Data</text>
  <text x="460" y="395" text-anchor="middle" font-size="11.5" fill="#854D0E">src/data — users, products, Excel profiles</text>

  <line x1="460" y1="410" x2="460" y2="434" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 5: Application Under Test (red) -->
  <rect x="260" y="444" width="400" height="60" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="460" y="469" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7F1D1D">Application Under Test</text>
  <text x="460" y="488" text-anchor="middle" font-size="11.5" fill="#991B1B">automationexercise.com — UI + REST API</text>

  <!-- Side note: shared state -->
  <rect x="20" y="540" width="880" height="150" rx="8" fill="#FAFAFA" stroke="#D1D5DB" stroke-width="1"/>
  <text x="40" y="566" font-size="12.5" font-weight="600" fill="#374151">Cross-cutting: shared execution state</text>
  <text x="40" y="590" font-size="11.5" fill="#4B5563">A single disposable account is created once (API layer), consumed by 6 dependent UI/API tests across the layers above, and deleted last.</text>
  <text x="40" y="610" font-size="11.5" fill="#4B5563">Ordering is enforced by an explicit pytest_collection_modifyitems hook; under parallel execution, pytest.mark.xdist_group keeps all</text>
  <text x="40" y="630" font-size="11.5" fill="#4B5563">8 dependent tests on a single pytest-xdist worker — see &#171;Parallel Execution &amp; Shared-Account Safety&#187; below.</text>
  <text x="40" y="662" font-size="11" fill="#6B7280">Legend:</text>
  <rect x="95" y="651" width="14" height="14" rx="3" fill="#EFF6FF" stroke="#2563EB"/><text x="114" y="662" font-size="11" fill="#374151">Execution</text>
  <rect x="185" y="651" width="14" height="14" rx="3" fill="#F0FDF4" stroke="#16A34A"/><text x="204" y="662" font-size="11" fill="#374151">Test layers</text>
  <rect x="280" y="651" width="14" height="14" rx="3" fill="#F5F3FF" stroke="#7C3AED"/><text x="299" y="662" font-size="11" fill="#374151">Framework components</text>
  <rect x="440" y="651" width="14" height="14" rx="3" fill="#FEFCE8" stroke="#CA8A04"/><text x="459" y="662" font-size="11" fill="#374151">Test data</text>
  <rect x="530" y="651" width="14" height="14" rx="3" fill="#FEF2F2" stroke="#DC2626"/><text x="549" y="662" font-size="11" fill="#374151">Application under test</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/>
    </marker>
  </defs>
</svg>
